<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lakshmi Chit Fund — Study group accountability tracker. Track daily tasks, manage fines, and stay disciplined together.">
  <title>Lakshmi Chit Fund</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <div class="login-logo">
        <span class="logo-icon">🪷</span>
        <h1>Lakshmi Chit Fund</h1>
        <p class="login-subtitle">Study Group Accountability Tracker</p>
      </div>
      <div class="login-members" id="login-members">
        <!-- Member buttons rendered by JS -->
      </div>
      <p class="login-hint">Select your name to continue</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo-icon-sm">🪷</span>
        <h1 class="topbar-title">Lakshmi Chit Fund</h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-accent btn-add-fine" id="btn-add-fine-global">
          <span class="btn-icon">+</span> Add Fine
        </button>
        <div class="user-menu">
          <span id="current-user-name" class="user-name"></span>
          <button class="btn btn-ghost btn-sm" id="btn-logout">Sign out</button>
        </div>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="sidebar">
      <a href="#/dashboard" class="nav-item active" data-route="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="#/members" class="nav-item" data-route="members">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Members
      </a>
      <a href="#/fines" class="nav-item" data-route="fines">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Fine History
      </a>
      <a href="#/today" class="nav-item" data-route="today">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Today's Tasks
      </a>
      <a href="#/rules" class="nav-item" data-route="rules">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Rules
      </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Rendered by JS -->
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-content">
      <!-- Modal content rendered by JS -->
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/members.js"></script>
  <script src="/js/fines.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
